[project]
name = "social-media-dept"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "feedparser>=6.0",
    "chromadb>=0.4,<0.5",
    "numpy>=1.24,<2.0",  # chromadb 0.4.x uses np.float_ removed in numpy 2.0
    "onnxruntime>=1.14,<1.21",  # 1.21+ dropped macOS x86_64; pin for macos_26_0_x86_64 compat
    # fastembed removed — onnxruntime has no x86_64 macOS wheel; ChromaDB default embeddings used instead
    "duckdb>=1.0",
    "anthropic>=0.93",
    "mcp>=1.0",
    "streamlit>=1.36",
    "python-telegram-bot>=21.0",
    "apprise>=1.9",
    "schedule>=1.2",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "nltk>=3.8",
    "ollama>=0.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    # openai-whisper installed separately via pip in install.sh (packaging incompatible with uv on macos_26_0_x86_64)
    "watchdog>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "psycopg2-binary>=2.9.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workers", "mcp_servers", "db"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live services (Ollama, Instagram)",
    "slow: takes more than 10 seconds",
]
